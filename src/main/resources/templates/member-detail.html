<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member Details</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/books">Books</a><a class="active" href="/members">Members</a><a href="/transactions">Transactions</a><a href="/reports">Reports</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1 th:text="${member.name}">Member</h1><p th:text="${member.membershipId + ' • ' + member.email}"></p></div><a class="btn secondary" href="/members">← Back to Members</a></div><div class="grid"><div class="card stat"><div class="label">Books currently taken</div><div class="num" th:text="${currentBooks}">0</div></div><div class="card stat"><div class="label">Overdue books</div><div class="num" th:text="${overdueBooks}">0</div></div><div class="card stat"><div class="label">Current fine</div><div class="num" th:text="${'₹' + fineTotal}">₹0</div></div></div><div class="section card"><div class="section-head"><div><h2>Borrowing &amp; return history</h2><div class="muted">Fine is calculated at ₹5 per overdue day.</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Book</th><th>Request Date</th><th>Issue Date</th><th>Due Date</th><th>Return Date</th><th>Status</th><th>Fine</th></tr></thead><tbody><tr th:each="loan:${loans}"><td th:text="${loan.book.title}"></td><td th:text="${loan.requestDate}"></td><td th:text="${loan.borrowDate != null ? loan.borrowDate : '-'}"></td><td th:text="${loan.dueDate != null ? loan.dueDate : '-'}"></td><td th:text="${loan.returnDate != null ? loan.returnDate : '-'}"></td><td th:text="${loan.status}"></td><td th:text="${'₹' + loan.fineAmount}"></td></tr><tr th:if="${#lists.isEmpty(loans)}"><td colspan="7" class="empty">No borrowing history.</td></tr></tbody></table></div></div></main></div></body></html>
