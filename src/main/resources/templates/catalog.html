<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Catalog | LibraDesk</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="public"><header class="public-nav"><div class="brand">Libra<span>Desk</span></div><nav><a href="/">Home</a><a class="active" href="/catalog">Books</a><a href="/login">Login</a><a class="btn" href="/register">Apply for Membership</a></nav></header><main class="public-section"><div class="title"><span class="eyebrow">PUBLIC CATALOG</span><h1>Browse the library</h1><p>Search the catalog without logging in. Borrowing requires an active member account.</p></div><form class="searchrow" method="get" action="/catalog"><input class="search" name="q" th:value="${q}" placeholder="Search title, author or genre..."><button>Search</button></form><div class="book-grid"><div class="card book" th:each="b:${books}"><div class="cover">📖</div><h3 th:text="${b.title}"></h3><div class="muted" th:text="${b.author}"></div><p class="muted" th:text="${b.genre + ' • ISBN ' + b.isbn}"></p><span class="badge ok" th:if="${b.available}">Available</span><span class="badge no" th:unless="${b.available}">Currently unavailable</span></div></div><div class="empty" th:if="${#lists.isEmpty(books)}">No books match your search.</div></main><footer>Want to borrow a book? <a href="/login">Sign in</a> or <a href="/register">apply for membership</a>.</footer></div></body></html>
