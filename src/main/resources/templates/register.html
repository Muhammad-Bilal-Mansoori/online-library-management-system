<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Application | LibraDesk</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="login-page"><div class="login-card wide"><div class="login-logo" style="color:#182230 !important;font-weight:900;">Libra<span style="color:#5b4ce8 !important;">Desk</span></div><p class="muted">Apply for library membership</p><div th:if="${param.error}" class="alert err" th:text="${param.error}"></div><div class="notice">Submitting this form creates a <b>pending application</b>. A librarian must approve it before you become an active library member.</div><form method="post" action="/register"><div class="field"><label>Full name</label><input name="name" required placeholder="Enter your full name"></div><div class="field"><label>Email</label><input name="email" type="email" required placeholder="Enter your email"></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required placeholder="Create a password"></div><button style="width:100%">Submit Membership Application</button></form><p class="muted center">Already have an active account? <a href="/login">Sign in</a></p></div></div></body></html>
