<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><div class="nav-title">Account</div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a th:if="${user.role.name()=='MEMBER'}" href="/my-books">▣ My Books</a><a th:if="${user.role.name()=='MEMBER'}" href="/notifications">◉ Notifications</a><a th:if="${user.role.name()=='LIBRARIAN'}" href="/members">♙ Members</a><a th:if="${user.role.name()=='LIBRARIAN'}" href="/transactions">↔ Transactions</a><a class="active" href="/profile">⚙ Profile</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">↪ Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Profile & preferences</h1><p>Manage your account details and library alerts.</p></div></div><div th:if="${param.success}" class="alert" th:text="${param.success}"></div><div class="split"><div class="card form"><h2>Account details</h2><form method="post" action="/profile/save"><div class="field"><label>Membership ID</label><input th:value="${user.membershipId}" disabled></div><div class="field"><label>Email</label><input th:value="${user.email}" disabled></div><div class="field"><label>Name</label><input name="name" th:value="${user.name}" required></div><div class="field"><label>New password <span class="muted">(leave blank to keep current)</span></label><input name="password" type="password" placeholder="Enter a new password"></div><button class="btn">Save changes</button></form></div><div class="card"><h2>Notification preferences</h2><p class="muted">Choose which automatic library alerts you want to receive.</p><form method="post" action="/profile/preferences" class="prefs"><label class="check"><input type="checkbox" name="dueAlerts" th:checked="${user.dueAlerts}"><span><b>Due-date alerts</b><small>Get reminders for books due soon and overdue items.</small></span></label><label class="check"><input type="checkbox" name="newBookAlerts" th:checked="${user.newBookAlerts}"><span><b>New-arrival alerts</b><small>Get notified when new books are added to the catalog.</small></span></label><button class="btn secondary">Save preferences</button></form></div></div></main></div></body></html>
