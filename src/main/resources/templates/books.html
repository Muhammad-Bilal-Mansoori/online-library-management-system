<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Books</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">Dashboard</a><a class="active" href="/books">Books</a><a th:if="${user.role.name()=='MEMBER'}" href="/my-books">My Books</a><a th:if="${user.role.name()=='MEMBER'}" href="/notifications">Notifications</a><a th:if="${user.role.name()=='LIBRARIAN'}" href="/members">Members</a><a th:if="${user.role.name()=='LIBRARIAN'}" href="/transactions">Transactions</a><a th:if="${user.role.name()=='LIBRARIAN'}" href="/reports">Reports</a><a href="/profile">Profile</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Book Catalog</h1><p>Search by title, author or genre.</p></div><a class="btn" th:if="${user.role.name()=='LIBRARIAN'}" href="/books/add">+ Add Book</a></div><div th:if="${param.success}" class="alert" th:text="${param.success}"></div><div th:if="${param.error}" class="alert err" th:text="${param.error}"></div><form class="searchrow" method="get" action="/books"><input class="search" name="q" th:value="${q}" placeholder="Search title, author, genre..."><button>Search</button></form><div class="section book-grid"><div class="card book" th:each="b:${books}"><div class="cover">📖</div><h3 th:text="${b.title}"></h3><div class="muted" th:text="${b.author}"></div><p class="muted" th:text="${b.genre + ' • ISBN ' + b.isbn}"></p><p><b>Total:</b> <span th:text="${b.totalCopies}">1</span> &nbsp; <b>Available:</b> <span th:text="${b.availableCopies}">1</span> &nbsp; <b>On Loan:</b> <span th:text="${b.onLoanCopies}">0</span></p><span class="badge ok" th:if="${b.available}">Available</span><span class="badge no" th:unless="${b.available}">All Copies On Loan</span><div class="actions" style="margin-top:14px"><form th:if="${user.role.name()=='MEMBER' && b.available}" method="post" th:action="@{'/borrow/'+${b.id}}" onsubmit="return confirm('Submit a borrow request for this book?')"><button>Request Borrow</button></form><a th:if="${user.role.name()=='LIBRARIAN'}" class="btn secondary" th:href="@{'/books/edit/'+${b.id}}">Edit</a><form th:if="${user.role.name()=='LIBRARIAN'}" method="post" th:action="@{'/books/delete/'+${b.id}}" onsubmit="return confirm('Delete this book?')"><button class="btn danger">Delete</button></form></div></div></div><div class="empty" th:if="${#lists.isEmpty(books)}">No books found.</div></main></div></body></html>
