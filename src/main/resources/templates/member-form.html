<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Add Member</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/members">Members</a><a href="/books">Books</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1 th:text="${member.id == null ? 'Add Member' : 'Edit Member'}"></h1><p>Create a new library member account.</p></div></div><div class="card form"><form method="post" action="/members/save"><input type="hidden" name="id" th:value="${member.id}"><div class="field"><label>Membership ID</label><input name="membershipId" th:value="${member.membershipId}" required placeholder="MEM003"></div><div class="field"><label>Name</label><input name="name" th:value="${member.name}" required></div><div class="field"><label>Email</label><input name="email" th:value="${member.email}" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" placeholder="Leave blank for member123"></div><button>Save Member</button></form></div></main></div></body></html>
