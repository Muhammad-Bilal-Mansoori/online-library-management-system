<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Notifications</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">Dashboard</a><a href="/books">Browse Books</a><a href="/my-books">My Books</a><a class="active" href="/notifications">Notifications</a><a href="/profile">Profile</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Notifications</h1><p>Due-date alerts, returns and new-arrival updates.</p></div></div><div class="card" th:each="n:${notifications}" style="margin-bottom:12px"><b>🔔 Library update</b><p th:text="${n.message}"></p><small class="muted" th:text="${n.createdAt}"></small></div><div class="empty" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</div></main></div></body></html>
