<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Book</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">Dashboard</a><a class="active" href="/books">Books</a><a href="/members">Members</a><a href="/transactions">Transactions</a><a href="/reports">Reports</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1 th:text="${book.id == null ? 'Add Book' : 'Edit Book'}"></h1><p>Manage title details and the number of physical copies.</p></div></div><div class="card form"><form method="post" action="/books/save"><input type="hidden" name="id" th:value="${book.id}"><div class="field"><label>Title</label><input name="title" th:value="${book.title}" required></div><div class="field"><label>Author</label><input name="author" th:value="${book.author}" required></div><div class="field"><label>ISBN</label><input name="isbn" th:value="${book.isbn}" required></div><div class="field"><label>Genre</label><input name="genre" th:value="${book.genre}" required></div><div class="field"><label>Total Copies</label><input name="totalCopies" type="number" min="1" th:value="${book.totalCopies}" required><div class="muted">Available and on-loan copies are calculated automatically.</div></div><div class="actions"><button>Save Book</button><a class="btn secondary" href="/books">Cancel</a></div></form></div></main></div></body></html>
