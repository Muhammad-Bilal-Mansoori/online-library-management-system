<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Membership Applications</title><link rel="stylesheet" href="/css/app.css"></head><body><div class="layout"><aside class="side"><div class="brand">Libra<span>Desk</span></div><nav class="nav"><a href="/dashboard">⌂ Dashboard</a><a href="/books">▣ Books</a><a class="active" href="/membership-applications">♙ Membership Applications</a><a href="/members">♙ Members</a><a href="/transactions">↔ Transactions</a><a href="/notifications/manage">◉ Notifications</a><a href="/reports">▥ Reports</a><a href="/profile">⚙ Profile</a><a href="/logout" onclick="return confirm('Are you sure you want to logout?')">↪ Logout</a></nav></aside><main class="main"><div class="top"><div class="title"><h1>Membership Applications</h1><p>Review applications before granting active library membership.</p></div></div><div th:if="${param.success}" class="alert" th:text="${param.success}"></div><div th:if="${param.error}" class="alert err" th:text="${param.error}"></div><div class="card table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Applied</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="a:${applications}"><td th:text="${a.name}"></td><td th:text="${a.email}"></td><td th:text="${a.appliedAt}"></td><td><span class="badge warn" th:if="${a.status.name()=='PENDING'}">Pending</span><span class="badge ok" th:if="${a.status.name()=='APPROVED'}">Approved</span><span class="badge no" th:if="${a.status.name()=='REJECTED'}">Rejected</span></td><td><div class="actions" th:if="${a.status.name()=='PENDING'}"><form method="post" th:action="@{'/membership-applications/'+${a.id}+'/approve'}" onsubmit="return confirm('Approve this membership application and create the member account?')"><button>Approve &amp; Create Member</button></form><form method="post" th:action="@{'/membership-applications/'+${a.id}+'/reject'}" onsubmit="return confirm('Reject this membership application?')"><button class="btn danger">Reject</button></form></div><span class="muted" th:unless="${a.status.name()=='PENDING'}">Closed</span></td></tr><tr th:if="${#lists.isEmpty(applications)}"><td colspan="5" class="empty">No membership applications.</td></tr></tbody></table></div></main></div></body></html>
